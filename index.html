<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documentos - Azul Cargo</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-hover: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 720px;
    }

    header {
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text);
    }

    p.subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    .file-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .file-card {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .file-card:hover {
      background-color: var(--card-hover);
      border-color: var(--accent);
    }

    .file-info {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--text);
      font-weight: 500;
      flex: 1;
      cursor: pointer;
    }

    .file-info:hover .file-name {
      color: var(--accent);
      text-decoration: underline;
    }

    .pdf-icon {
      width: 28px;
      height: 28px;
      fill: #ef4444;
      flex-shrink: 0;
    }

    .actions {
      display: flex;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    .btn {
      padding: 0.45rem 0.85rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid var(--border);
      background-color: var(--bg);
      color: var(--text);
      transition: all 0.2s;
    }

    .btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-primary {
      background-color: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
      font-weight: 600;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
      color: #ffffff;
    }

    .status {
      text-align: center;
      color: var(--text-muted);
      padding: 2rem;
      background: var(--card);
      border-radius: 8px;
    }

    @media (max-width: 520px) {
      .file-card {
        flex-direction: column;
        align-items: flex-start;
      }
      .actions {
        width: 100%;
        justify-content: flex-end;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Documentos e Checklists</h1>
      <p class="subtitle">Clique no arquivo para visualizar/imprimir ou baixe diretamente</p>
    </header>

    <div id="file-list" class="file-list">
      <div class="status">Carregando arquivos do GitHub...</div>
    </div>
  </div>

  <script>
    const REPO_OWNER = 'cristianop1987';
    const REPO_NAME = 'Docs_Azul';
    const FOLDER_PATH = 'Arquivo';
    const BRANCH = 'main';

    const listContainer = document.getElementById('file-list');

    async function loadPDFs() {
      try {
        const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FOLDER_PATH}?ref=${BRANCH}`;
        const response = await fetch(apiUrl);

        if (!response.ok) {
          throw new Error('Não foi possível carregar os arquivos. Verifique se o repositório é público.');
        }

        const files = await response.json();
        const pdfFiles = files.filter(file => file.type === 'file' && file.name.toLowerCase().endsWith('.pdf'));

        if (pdfFiles.length === 0) {
          listContainer.innerHTML = '<div class="status">Nenhum arquivo PDF encontrado na pasta.</div>';
          return;
        }

        listContainer.innerHTML = '';

        pdfFiles.forEach(file => {
          // URL do GitHub Pages (abre nativamente no navegador como PDF, ideal para imprimir)
          const encodedPath = encodeURIComponent(file.name);
          const pagesUrl = `https://${REPO_OWNER}.github.io/${REPO_NAME}/${FOLDER_PATH}/${encodedPath}`;
          
          // URL direta do raw.githubusercontent para download forçado
          const rawUrl = file.download_url;

          const card = document.createElement('div');
          card.className = 'file-card';

          card.innerHTML = `
            <a href="${pagesUrl}" target="_blank" rel="noopener noreferrer" class="file-info" title="Abrir PDF para visualização e impressão">
              <svg class="pdf-icon" viewBox="0 0 24 24">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 2l5 5h-5V4zM8.5 13H10c.83 0 1.5.67 1.5 1.5S10.83 16 10 16H9.25v1.5H8.5V13zm.75 2.25H10c.41 0 .75-.34.75-.75s-.34-.75-.75-.75h-.75v1.5zm3.25-2.25h1.25c1.1 0 2 .9 2 2v.5c0 1.1-.9 2-2 2H12.5V13zm.75 3.75h.5c.69 0 1.25-.56 1.25-1.25v-.5c0-.69-.56-1.25-1.25-1.25h-.5v3zm3.25-3.75h2.25v.75H17.25v1h1.25v.75h-1.25v1.5H16.5V13z"/>
              </svg>
              <span class="file-name">${file.name}</span>
            </a>
            <div class="actions">
              <a href="${pagesUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-primary">Abrir / Imprimir</a>
              <button onclick="downloadFile('${rawUrl}', '${file.name}')" class="btn">Baixar</button>
            </div>
          `;

          listContainer.appendChild(card);
        });

      } catch (error) {
        listContainer.innerHTML = `<div class="status">Erro: ${error.message}</div>`;
      }
    }

    // Função para forçar o download direto do arquivo sem abrir outra aba
    async function downloadFile(url, filename) {
      try {
        const res = await fetch(url);
        const blob = await res.blob();
        const blobUrl = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        window.URL.revokeObjectURL(blobUrl);
      } catch (e) {
        window.open(url, '_blank');
      }
    }

    loadPDFs();
  </script>
</body>
</html>
